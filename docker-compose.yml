# Docker Compose for Kanflow-Brand
# Full-stack container orchestration

name: Kanflow-Brand

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: Kanflow-Brand-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - Kanflow-Brand-network

  db:
    image: postgres:16-alpine
    container_name: Kanflow-Brand-postgres
    environment:
      POSTGRES_DB: Kanflow-Brand
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - Kanflow-Brand_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - Kanflow-Brand-network

networks:
  Kanflow-Brand-network:
    driver: bridge

volumes:
  Kanflow-Brand_postgres_data:
