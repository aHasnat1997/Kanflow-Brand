name: Kanflow-Brand

services:
  postgres:
    image: postgres
    container_name: Kanflow-Brand-postgres
    environment:
      POSTGRES_DB: Kanflow-Brand
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - Kanflow-Brand_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  Kanflow-Brand_postgres_data:
